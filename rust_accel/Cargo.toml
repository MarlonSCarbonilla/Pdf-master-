[package]
name = "pdf_rust_accel"
version = "1.0.0"
edition = "2021"
description = "Native Rust PDF pixel, diff, grayscale, watermark, and hashing accelerator for PDF Master"

[lib]
name = "pdf_rust_accel"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
